[build]
  command = "echo Building Skin Roma static site and functions"
  publish = "."

[functions]
  directory = "netlify/functions"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data: blob: https://*.supabase.co; media-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; script-src 'self' 'unsafe-inline'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# HTML must revalidate on every deploy so clients never stay on an old build.

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Assets use a short cache because filenames are intentionally stable across client rounds.
# This prevents the stale-video/stale-image problem seen during iterative deploys.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep language pages on explicit .html URLs to avoid slash-normalization redirect loops.
[build.processing.html]
  pretty_urls = false

# Admin should never be cached or indexed.
[[headers]]
  for = "/admin.html"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"


# Prevent operational/source files from being exposed when the project root is used as publish output.
[[redirects]]
  from = "/supabase-setup.sql"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/SETUP-CARLO-ADMIN.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/FINAL-AUDIT.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/FINAL-AUDIT-CARLO.txt"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/.env.example"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/admin"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"

[[redirects]]
  from = "/gestione"
  to = "/admin.html"
  status = 200

[[headers]]
  for = "/gestione"
  [headers.values]
    Cache-Control = "no-store"
    X-Robots-Tag = "noindex, nofollow, noarchive"
