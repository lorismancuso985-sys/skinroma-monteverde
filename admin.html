<!doctype html>
<html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#0f0e0d"><title>Skin Roma · Gestione</title><link rel="stylesheet" href="admin.css?v=20260916c"></head>
<body><main class="admin-shell">
<section class="login" id="loginView"><div class="brand"><b>SKIN</b><em>Roma</em><span>AREA GESTIONE</span></div><form id="loginForm"><label>Password amministratore<input id="password" type="password" autocomplete="current-password" required></label><button type="submit">Accedi <span>↗</span></button><p id="loginStatus" role="status"></p></form><small>Accesso riservato a Skin Roma.</small></section>
<section class="dashboard" id="dashboard" hidden>
<header><div class="brand brand--small"><b>SKIN</b><em>Roma</em><span>GESTIONE</span></div><div class="header-actions"><a href="index.html" target="_blank" rel="noopener">Apri sito ↗</a><button id="logoutBtn" class="ghost" type="button">Esci</button></div></header>
<div class="hero-admin"><div><p>CONTROL ROOM</p><h1>Gestione<br><em>Skin Roma.</em></h1></div><div class="stats"><article><span>Iscritti</span><strong id="subscriberCount">—</strong></article><article><span>Prodotti pubblicati</span><strong id="productCount">—</strong></article></div></div>
<nav class="tabs" aria-label="Sezioni"><button class="is-active" data-tab="subscribers" type="button">Iscritti newsletter</button><button data-tab="products" type="button">Prodotti</button></nav>
<section class="panel is-active" data-panel="subscribers"><div class="panel-head"><div><p>NEWSLETTER</p><h2>Contatti raccolti</h2></div><div class="tools"><input id="subscriberSearch" type="search" placeholder="Cerca nome, email, telefono…" aria-label="Cerca tra gli iscritti"><button id="exportCsv" class="secondary" type="button">Esporta CSV</button></div></div><div id="subscribersList" class="subscriber-list"></div></section>
<section class="panel" data-panel="products"><div class="panel-head"><div><p>CATALOGO</p><h2>Prodotti sul sito</h2></div><button id="newProduct" class="secondary" type="button">+ Nuovo prodotto</button></div><div class="product-admin-grid"><form id="productForm" class="product-editor"><input type="hidden" id="productId"><label>Titolo<input id="productTitle" maxlength="120" required placeholder="Es. Dermalogica Daily Microfoliant"></label><label>Descrizione<textarea id="productDescription" maxlength="500" rows="4" placeholder="Breve descrizione del prodotto"></textarea></label><div class="two"><label>Prezzo €<input id="productPrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="39"></label><label>Ordine<input id="productSort" type="number" min="0" step="1" value="0"></label></div><label class="upload">Foto prodotto<input id="productImage" type="file" accept="image/*"><span id="uploadLabel">Scegli una foto</span></label><img id="productPreview" class="preview" alt="Anteprima prodotto" hidden><label class="toggle"><input id="productPublished" type="checkbox"><span>Pubblica sul sito</span></label><div class="editor-actions"><button type="submit">Salva prodotto</button><button id="cancelEdit" type="button" class="ghost">Annulla</button></div><p id="productStatus" role="status"></p></form><div id="productsList" class="products-list"></div></div></section>
</section></main><script src="admin.js?v=20260916b" defer></script></body></html>
